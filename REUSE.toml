# See https://reuse.software/spec-3.2/#reusetoml for specification
version = 1

# No special copyrights, e.g. screenshots or config files:
[[annotations]]
path = ["**/.gitignore", ".pylintrc", ".vscode/*.json", "pytest.ini", "requirements-dev.txt", "ruff.toml", "metadata.txt", "modules/examples/qgis_default_icons.txt", ".gitmodules"]
precedence = "aggregate"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "GPL-3.0-only"

# All ui files from the modules/examples:
[[annotations]]
path = ["modules/examples/*.ui", "modules/dev/*.ui"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Deutsche Telekom Technik GmbH <f.vonstudsinske@telekom.de>"
SPDX-License-Identifier = "GPL-3.0-only"

# All ui files from the modules/plot:
[[annotations]]
path = ["modules/plot/*.ui"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Deutsche Telekom Technik GmbH <f.vonstudsinske@telekom.de>"
SPDX-License-Identifier = "GPL-3.0-only"

# All translation related files:
[[annotations]]
path = ["i18n/*.qm", "i18n/*.ts"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Deutsche Telekom Technik GmbH <f.vonstudsinske@telekom.de>"
SPDX-License-Identifier = "GPL-3.0-only"

# templates/icons
[[annotations]]
path = ["templates/icons/icon.svg", "templates/icons/add_page_landscape.svg", "templates/icons/add_page_portrait.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Deutsche Telekom Technik GmbH <f.vonstudsinske@telekom.de>"
SPDX-License-Identifier = "GPL-3.0-only"

# templates/plot
[[annotations]]
path = ["templates/plots/plot_layer_stil.qml", "templates/plots/public/*.qpt", "templates/plots/public/icon.svg", "templates/plots/public/plots.xml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Deutsche Telekom Technik GmbH <f.vonstudsinske@telekom.de>"
SPDX-License-Identifier = "GPL-3.0-only"
